name: API security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: SAST — Bandit
        if: ${{ !cancelled() }}
        run: bandit -r app.py -f json -o bandit-report.json
      - name: SCA — pip-audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json
      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: '*-report.json'
          retention-days: 14

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Official image includes a regularly refreshed vulnerability database.
      - name: SCA — OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: infosec-1
          path: requirements.txt
          format: HTML
          out: dependency-check-reports
          args: >-
            --format JSON
            --enableExperimental
            --failOnCVSS 7
      - name: Verify Python dependencies were scanned
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path

          report = json.loads(Path('dependency-check-reports/dependency-check-report.json').read_text())
          dependencies = report.get('dependencies', [])
          packages = [package['id'] for dependency in dependencies
                      for package in dependency.get('packages', [])
                      if package.get('id', '').startswith('pkg:pypi/')]
          if not packages:
              raise SystemExit('Dependency-Check did not identify any Python packages')
          print(f'Identified {len(packages)} Python packages:')
          print('\n'.join(sorted(packages)))
          PYTHON
      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-results
          path: dependency-check-reports/
          if-no-files-found: error
          retention-days: 14
