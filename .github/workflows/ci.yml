name: API security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: SAST — Bandit
        if: ${{ !cancelled() }}
        run: bandit -r app.py -f json -o bandit-report.json
      - name: SCA — pip-audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json
      - name: Upload scanner results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: '*-report.json'
          retention-days: 14

  snyk:
    # Секреты не выдаются PR из форков. Основной SCA выше работает на каждом PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Explain missing Snyk token
        if: env.SNYK_TOKEN == ''
        run: echo '::warning::Snyk skipped. Add SNYK_TOKEN to repository secrets to enable it. pip-audit runs independently.'
      - uses: actions/checkout@v4
        if: env.SNYK_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.SNYK_TOKEN != ''
        with:
          python-version: '3.14'
      - name: Install dependencies
        if: env.SNYK_TOKEN != ''
        run: python -m pip install -r requirements.txt
      - uses: snyk/actions/setup@master
        if: env.SNYK_TOKEN != ''
      - name: SCA — Snyk
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=requirements.txt --package-manager=pip --command=python --severity-threshold=high --json-file-output=snyk-report.json
      - uses: actions/upload-artifact@v4
        if: always() && env.SNYK_TOKEN != ''
        with:
          name: snyk-results
          path: snyk-report.json
          retention-days: 14
